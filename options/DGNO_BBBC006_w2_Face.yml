# DGNO-Face · BBBC006 w2 (Phalloidin-stained actin, grayscale)
name: DGNO_BBBC006_w2_Face
model_type: ImageCleanModel86
scale: 1
num_gpu: 1
manual_seed: 100

# dataset and data loader settings
datasets:
  train:
    name: TrainSet
    type: Dataset_PairedImage_tif
    dataroot_gt: ./datasets/BBBC006/train/GT
    dataroot_lq: ./datasets/BBBC006/train/blur
    geometric_augs: true

    BBBCw: 'w2'

    filename_tmpl: '{}'
    io_backend:
      type: disk

    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 8

    ### ------- Progressive training -------
    mini_batch_sizes: [8]
    iters: [60000]
    gt_size: 256
    gt_sizes: [256]
    ### ------------------------------------

    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: ValSet
    type: Dataset_PairedImage_tif
    dataroot_gt: ./datasets/BBBC006/test/GT
    dataroot_lq: ./datasets/BBBC006/test/blur
    crop_size: 256
    crop_sizes: [256]
    io_backend:
      type: disk

    BBBCw: 'w2'

# network structures
network_g:
  type: DGNO
  variant: face
  inp_channels: 1
  out_channels: 1
  dim: 48
  num_blocks: [2,4,6,2]
  num_refinement_blocks: 4
  heads: [1,2,4,8]
  ffn_expansion_factor: 2.66
  bias: False
  LayerNorm_type: WithBias
  train_size: 512

  learnable_tau: True
  init_tau: 0.25
  flux_mode: jump
  boundary_type: neumann      # "neumann", "periodic", "dirichlet"

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  total_iter: 60000
  warmup_iter: -1
  use_grad_clip: true
  ema_decay: 0.999

  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [20000, 40000]
    restart_weights: [1,1]
    eta_mins: [0.0003,0.000001]

  mixing_augs:
    mixup: false
    mixup_beta: 1.2
    use_identity: true

  optim_g:
    type: AdamW
    lr: !!float 3e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]

  pixel_opt:
    type: L1Loss
    loss_weight: 1
    reduction: mean

# validation settings
val:
  window_size: 8
  val_freq: !!float 4e3
  save_img: false
  rgb2bgr: true
  use_image: false
  max_minibatch: 8

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 1000
  save_checkpoint_freq: !!float 4e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
